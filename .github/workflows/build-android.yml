name: Build Traffic Counter APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip \
            libffi-dev libssl-dev python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libsqlite3-dev libpng-dev \
            build-essential ccache

      # FIX (speed): ccache was installed but its own cache directory was
      # never persisted across CI runs — every run started with an empty
      # ccache and got zero benefit from it. Cached separately from (and
      # NOT keyed on) buildozer.spec, so it still helps even on a run that
      # needs a cold ~/.buildozer rebuild (e.g. after a buildozer.spec
      # change). 2G cap keeps it from growing unbounded.
      - name: Cache ccache directory
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-v1
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          ccache --max-size=2G
          ccache --set-config=cache_dir=~/.ccache

      # ── SPEED FIX: cache moved up and given an id, so we can skip the ─────
      # ~4-5 min SDK download/install step entirely when the cache already
      # has it. Previously this ran unconditionally on every single build
      # even when nothing needed re-downloading.
      - name: Cache Buildozer directory
        id: buildozer_cache
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-v7-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-v7-

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip setuptools
          pip install cython==0.29.33
          pip install buildozer==1.5.0

      # FIX (speed): only runs when the cache didn't already provide a
      # working SDK — was previously re-downloading and re-installing the
      # Android cmdline-tools + SDK packages on every build regardless of
      # cache hit, wasting several minutes each time for nothing.
      #
      # FIX (idempotency): steps.buildozer_cache.outputs.cache-hit is only
      # 'true' on an EXACT key match. A cache miss on the exact key (e.g.
      # buildozer.spec changed) still falls through to the restore-keys
      # PREFIX match ("buildozer-${{ runner.os }}-v7-"), which restores an
      # older cache's files — including a previously-populated
      # cmdline-tools/latest/ — while still reporting cache-hit: 'false'.
      # That left $SDK_ROOT/cmdline-tools/latest non-empty before this
      # step ran, so `mv cmdline-tools .../latest` failed with "Directory
      # not empty" (mv tried to nest the freshly-unzipped folder inside
      # the existing one instead of replacing it). Removing any stale
      # latest/ first makes this step safe to run regardless of what the
      # cache fallback restored.
      - name: Set up Android SDK manually
        if: steps.buildozer_cache.outputs.cache-hit != 'true'
        run: |
          SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          rm -rf $SDK_ROOT/cmdline-tools/latest
          mkdir -p $SDK_ROOT/cmdline-tools
          mkdir -p $SDK_ROOT/tools/bin
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools $SDK_ROOT/cmdline-tools/latest
          mkdir -p $SDK_ROOT/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK_ROOT/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> $SDK_ROOT/licenses/android-sdk-license
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > $SDK_ROOT/licenses/android-sdk-preview-license
          yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_ROOT --licenses || true
          $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$SDK_ROOT \
            "platform-tools" \
            "build-tools;33.0.2" \
            "platforms;android-31"
          cat > $SDK_ROOT/tools/bin/sdkmanager << 'WRAPPER'
          #!/bin/bash
          exec $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "$@"
          WRAPPER
          chmod +x $SDK_ROOT/tools/bin/sdkmanager

      - name: Verify setup
        run: |
          java -version
          echo "SDK tools:"
          ls ~/.buildozer/android/platform/android-sdk/tools/bin/
          echo "Cmdline tools:"
          ls ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/

      # FIX: download.savannah.gnu.org (the freetype recipe's hardcoded
      # source URL, baked into python-for-android itself) has intermittently
      # 502'd across multiple builds in a row — this is a known, documented
      # issue with Savannah's redirector, not anything in our config.
      # Savannah's own site explicitly recommends download-mirror
      # .savannah.gnu.org as the workaround for exactly this. Buildozer
      # normally clones python-for-android itself fresh on every build (this
      # checkout isn't cached — only the SDK/NDK under ~/.buildozer is), but
      # if the directory already exists beforehand, buildozer detects that
      # and just verifies the existing checkout instead of re-cloning. So we
      # clone it ourselves here, first, and patch the freetype recipe's URL
      # to the working mirror before buildozer ever gets to it.
      - name: Pre-clone python-for-android and patch flaky freetype mirror
        run: |
          P4A_DIR=".buildozer/android/platform/python-for-android"
          if [ ! -d "$P4A_DIR" ]; then
            mkdir -p .buildozer/android/platform
            git clone -b master --single-branch https://github.com/kivy/python-for-android.git "$P4A_DIR"
          fi
          RECIPE_FILE="$P4A_DIR/pythonforandroid/recipes/freetype/__init__.py"
          if [ -f "$RECIPE_FILE" ]; then
            echo "Before patch:"
            grep -n "savannah" "$RECIPE_FILE" || true
            sed -i 's/download\.savannah\.gnu\.org/download-mirror.savannah.gnu.org/' "$RECIPE_FILE"
            echo "After patch:"
            grep -n "savannah" "$RECIPE_FILE" || true
          else
            echo "::warning::freetype recipe file not found at $RECIPE_FILE — python-for-android's internal layout may have changed, so this mirror patch had no effect. The retry loop in the Build APK step is still in place as a fallback."
          fi

      # ── Patch version code so Android recognises each build as newer ──────
      - name: Patch version code
        run: |
          sed -i "s/android.numeric_version = .*/android.numeric_version = ${{ github.run_number }}/" buildozer.spec
          echo "Version code set to: ${{ github.run_number }}"
          grep "android.numeric_version" buildozer.spec

      # ── Write persistent release keystore, patch passwords ────────────────
      - name: Write release keystore
        run: |
          # FIX: fail immediately and by name if any of the three
          # keystore-related secrets are missing/empty, rather than
          # silently proceeding with blank values. Without this, a
          # missing secret produces an empty string here, which base64
          # -d and sed both happily "succeed" with — the failure only
          # surfaces much later as a cryptic Gradle KeytoolException deep
          # inside packageRelease, ~1 minute into the actual build.
          if [ -z "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_B64 is missing or empty. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_PASSWORD is missing or empty. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "::error::Secret RELEASE_KEY_PASSWORD is missing or empty. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > release.keystore
          sed -i "s/CI_KEYSTORE_PASSWORD_PLACEHOLDER/${{ secrets.RELEASE_KEYSTORE_PASSWORD }}/" buildozer.spec
          sed -i "s/CI_KEY_PASSWORD_PLACEHOLDER/${{ secrets.RELEASE_KEY_PASSWORD }}/" buildozer.spec

      # FIX: the actual root-cause finder for this whole class of bug —
      # confirms the decoded keystore is a real, openable keystore
      # containing the expected alias, BEFORE Gradle ever gets near it.
      # Catches: an empty/missing RELEASE_KEYSTORE_B64 secret, a
      # corrupted base64 value (extra newline, truncated copy-paste,
      # wrong file re-encoded), or a wrong password/alias — all of which
      # previously surfaced ~1 minute into the Gradle build as an opaque
      # "com.android.ide.common.signing.KeytoolException: Tag number
      # over 30 is not supported", with no indication of WHICH of these
      # was the actual cause.
      - name: Verify keystore is valid and contains the expected alias
        run: |
          if ! keytool -list -keystore release.keystore -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" > /tmp/keytool_list.txt 2>&1; then
            echo "::error::release.keystore could not be opened with the RELEASE_KEYSTORE_PASSWORD secret. Either the keystore file is corrupted (check how RELEASE_KEYSTORE_B64 was generated/pasted — regenerate with 'base64 -w0 patsb-release.keystore' and re-paste with no manual edits) or RELEASE_KEYSTORE_PASSWORD is wrong."
            cat /tmp/keytool_list.txt
            exit 1
          fi
          if ! grep -qi "^patsb," /tmp/keytool_list.txt; then
            echo "::error::release.keystore opened fine, but no alias named 'patsb' was found inside it. Contents:"
            cat /tmp/keytool_list.txt
            exit 1
          fi
          echo "Keystore verified OK — opens with the given password and contains alias 'patsb'."

      - name: Verify keystore passwords were patched
        run: |
          if grep -q "CI_KEYSTORE_PASSWORD_PLACEHOLDER\|CI_KEY_PASSWORD_PLACEHOLDER" buildozer.spec; then
            echo "::error::Keystore password placeholder was NOT replaced. Check that RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_PASSWORD secrets exist, and that the password doesn't contain / or & (which break this sed command)."
            exit 1
          else
            echo "Keystore password placeholders were replaced (values hidden)."
          fi

      # FIX: force-delete any stale packaged app source before building —
      # the ~/.buildozer cache is keyed on buildozer.spec, not main.py, so
      # a main.py-only change could otherwise reuse an old packaged copy.
      # Searches broadly (both "dists" and "dist") to catch either p4a
      # directory layout.
      - name: Force-clean stale app package
        run: |
          for pat in dists dist; do
            find ~/.buildozer -type d -name "$pat" 2>/dev/null | while read d; do
              echo "Removing stale package dir: $d"
              rm -rf "$d"
            done
          done
          # FIX: Buildozer keeps its own state file separate from the p4a
          # dist folders. If it thinks buildozer.spec is unchanged, it can
          # skip re-invoking the packaging step entirely, reusing an old
          # APK even after dists is cleared. Remove it so every build is
          # forced to actually re-run packaging.
          echo "Removing Buildozer state file(s):"
          find ~/.buildozer -maxdepth 1 -iname "state.db*" -print -delete 2>/dev/null || true

      # FIX: bin/ may still contain an old leftover APK (possibly even
      # committed to git). Wipe it before building so "Find APK" can only
      # ever pick up output from THIS run.
      - name: Clean old bin output
        run: rm -rf bin

      # FIX: continue-on-error was silently swallowing real build
      # failures — if `buildozer android release` genuinely errored out
      # (e.g. a signing problem), the workflow kept going anyway and later
      # steps quietly picked up a stale leftover APK instead of failing
      # loudly. Now a real build failure stops the workflow here, with the
      # log printed directly so the actual error is visible immediately.
      # FIX: buildozer.spec's android.keystore/keystore_password/keyalias
      # fields were supposed to get translated into these exact env vars
      # by Buildozer before invoking python-for-android — but the build
      # log showed "P4A_RELEASE_KEYSTORE is missing", meaning that
      # translation isn't happening in this buildozer version. Set them
      # directly ourselves so signing can't silently fail this way again.
      - name: Build APK
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          # FIX: NOT renamed to match a generic "release" naming pass —
          # this value must exactly match the alias that was baked into
          # the keystore file itself when it was originally generated via
          # keytool. Changing this string alone (without also running
          # `keytool -changealias` on the actual .keystore file) would
          # break APK signing outright.
          P4A_RELEASE_KEYALIAS: patsb
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # FIX: fallback safety net beyond the freetype mirror patch above
          # — retries the WHOLE build with longer backoff (30s/60s/120s)
          # than p4a's own internal retries (1/2/4/8 SECONDS, too fast to
          # ride out a real outage). Since python-for-android's own
          # checkout and any already-downloaded recipe sources persist
          # across these attempts (same job, nothing gets wiped between
          # tries), a retry after a transient failure resumes quickly
          # rather than starting over from scratch.
          set +e
          MAX_ATTEMPTS=3
          SLEEP_SECS=30
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "=== Build attempt $ATTEMPT/$MAX_ATTEMPTS ==="
            if [ $ATTEMPT -eq 1 ]; then
              buildozer -v android release 2>&1 | tee build.log
            else
              buildozer -v android release 2>&1 | tee -a build.log
            fi
            STATUS=${PIPESTATUS[0]}
            if [ $STATUS -eq 0 ] && [ -d bin ] && [ -n "$(find bin -name '*.apk' 2>/dev/null)" ]; then
              echo "Build succeeded on attempt $ATTEMPT"
              break
            fi
            echo "Build attempt $ATTEMPT failed (exit $STATUS)."
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Sleeping ${SLEEP_SECS}s before retrying..."
              sleep $SLEEP_SECS
              SLEEP_SECS=$((SLEEP_SECS * 2))
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          if [ ! -d bin ] || [ -z "$(find bin -name '*.apk' 2>/dev/null)" ]; then
            echo "::error::buildozer did not produce an APK after $MAX_ATTEMPTS attempts. Last 100 lines of the log:"
            tail -n 100 build.log
            exit 1
          fi

      - name: ccache stats
        run: ccache -s

      # FIX: buildozer can leave BOTH an unsigned intermediate APK and the
      # final signed one in bin/. An unsigned APK is roughly half the size
      # and Android refuses to install it ("package appears to be
      # invalid"). Delete the unsigned one immediately so nothing
      # downstream can ever pick it up by accident.
      - name: Remove unsigned intermediate APK
        run: |
          find bin -iname "*-unsigned.apk" -print -delete 2>/dev/null || true
          if [ -z "$(find bin -name '*.apk' 2>/dev/null)" ]; then
            echo "::error::Only an unsigned APK was produced — the signed final APK is missing. This means signing genuinely failed; check the keystore secrets."
            exit 1
          fi

      - name: Find APK
        run: |
          find . -name "*.apk" 2>/dev/null
          ls -la bin/ 2>/dev/null || echo "No bin/ folder"

      # FIX: hard proof, not a guess — unpacks the built APK and checks
      # whether the actual current main.py fix code is inside it. Fails the
      # whole workflow loudly if it's not, instead of silently shipping a
      # stale build. "_lock_undo_redo" only exists in the fixed source.
      - name: Verify fresh source was packaged
        run: |
          APK=$(find bin -name "*.apk" 2>/dev/null | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found — build failed before packaging."
            exit 1
          fi
          echo "Checking $APK"
          cat > /tmp/scan_apk.py << 'PYEOF'
          import zipfile, tarfile, sys, io

          TARGET = b"_lock_undo_redo"
          total_entries = [0]

          def scan(entries_iter, read_fn, path_prefix=""):
              found = False
              for name in entries_iter:
                  full_name = path_prefix + name
                  total_entries[0] += 1
                  try:
                      data = read_fn(name)
                  except Exception as e:
                      continue
                  if full_name.lower().endswith(('.py', '.pyc', '.pyo')):
                      print(f"  python-ish file: {full_name} ({len(data)} bytes)")
                  if TARGET in data:
                      print(f"FOUND target string in: {full_name}")
                      found = True
                  # Try nested zip
                  try:
                      nz = zipfile.ZipFile(io.BytesIO(data))
                      if scan(nz.namelist(), nz.read, full_name + "!/"):
                          found = True
                      continue
                  except Exception:
                      pass
                  # Try nested tar (some p4a bootstraps bundle app source
                  # as a .tar, not a .zip, regardless of file extension)
                  try:
                      tf = tarfile.open(fileobj=io.BytesIO(data))
                      names = [m.name for m in tf.getmembers() if m.isfile()]
                      def _tread(n, tf=tf):
                          return tf.extractfile(n).read()
                      if scan(names, _tread, full_name + "!/"):
                          found = True
                  except Exception:
                      pass
              return found

          with zipfile.ZipFile(sys.argv[1]) as zf:
              result = scan(zf.namelist(), zf.read)

          print(f"Total entries scanned (incl. nested): {total_entries[0]}")
          sys.exit(0 if result else 1)
          PYEOF
          if python3 /tmp/scan_apk.py "$APK"; then
            echo "FRESH SOURCE CONFIRMED: fix code is present in $APK"
          else
            echo "::error::STALE BUILD DETECTED — the current main.py fix was NOT found inside the built APK (recursively checked all nested zip content). The packaged app source is out of date."
            exit 1
          fi

      # FIX: commit message now goes at the FRONT of the filename, per
      # request, followed by the short commit SHA.
      - name: Rename APK with commit info
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s | tr -c '[:alnum:]-_' '_' | cut -c1-40)
          if [ -d bin ]; then
            cd bin
            for f in *.apk; do
              [ -e "$f" ] || continue
              base="${f%.apk}"
              mv "$f" "${COMMIT_MSG}_${SHORT_SHA}_${base}.apk"
            done
            ls -la
            cd ..
          fi

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Traffic-Counter
          # FIX: removed .buildozer/**/*.apk — that glob could surface an
          # extra unsigned intermediate copy from deep inside the build
          # tree, leaving two similarly-named APKs in the artifact zip
          # with no obvious way to tell which one is correct. bin/ is the
          # only place the final signed APK should ever be picked up from.
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: warn
      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore
