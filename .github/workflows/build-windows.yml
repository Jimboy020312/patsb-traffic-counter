name: Build PATSB Traffic Counter Windows EXE
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    # FIX: hard cap so a hung build fails fast and loudly instead of
    # silently running for hours until someone notices and cancels it.
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # FIX: Windows Defender's real-time scanner is a well-known cause
      # of extremely slow (sometimes effectively hung) PyInstaller builds
      # on Windows — it scans every one of the thousands of small files
      # PyInstaller copies (Kivy bundles a lot of fonts/data files) in
      # real time. Excluding the workspace and pip cache from scanning
      # removes that bottleneck entirely.
      - name: Exclude workspace from Windows Defender scanning
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\pip\cache"
          Add-MpPreference -ExclusionProcess "python.exe"
          Add-MpPreference -ExclusionProcess "pyinstaller.exe"

      # FIX: pinned to a specific, known-good version with prebuilt
      # Windows wheels. An unpinned "pip install kivy" can occasionally
      # resolve to attempting a source build instead of grabbing a wheel,
      # which involves compiling Cython extensions and can take a very
      # long time (or effectively hang) instead of the usual ~30 seconds.
      # kivy_deps.angle is also installed here — see the Build step below
      # for why it's needed.
      # FIX: the actual root cause of the 2-hour hang — GitHub's Windows
      # runners only provide a basic "GDI Generic" OpenGL 1.1 software
      # stub with no real GPU. Kivy creates a real window/GL context the
      # moment it's imported (not deferred to app launch), so PyInstaller's
      # analysis phase genuinely crashes Kivy's window init (it requires
      # OpenGL 2.0 minimum) — and that crash didn't exit cleanly, hanging
      # the job instead of failing fast.
      #
      # Fix: drop Mesa's software OpenGL renderer (llvmpipe, real 2.0+
      # support, just slower than a GPU) next to python.exe. Windows'
      # DLL search order checks the executable's own folder before
      # System32, so this doesn't touch anything system-wide — it only
      # affects this specific python.exe.
      - name: Install Mesa software OpenGL renderer
        shell: powershell
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "release-msvc\.7z$" } | Select-Object -First 1
          if (-not $asset) { throw "Could not find a suitable mesa-dist-win release asset" }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mesa.7z

          & "C:\Program Files\7-Zip\7z.exe" x mesa.7z -omesa_extracted -y

          $pythonDir = Split-Path -Parent (Get-Command python).Source
          Write-Host "Deploying Mesa opengl32.dll to $pythonDir"
          Copy-Item "mesa_extracted\x64\opengl32.dll" -Destination $pythonDir -Force
          if (Test-Path "mesa_extracted\x64\libgallium_wgl.dll") {
            Copy-Item "mesa_extracted\x64\libgallium_wgl.dll" -Destination $pythonDir -Force
          }

      - name: Install Kivy and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install kivy==2.3.0 kivy_deps.angle kivy_deps.glew kivy_deps.sdl2 pyinstaller==6.10.0 pillow

      # FIX: this is what was actually causing the multi-hour hang.
      # GitHub's windows-latest runners have no real GPU — only a
      # software OpenGL 1.1 renderer via GDI. PyInstaller's analysis
      # phase imports main.py to discover dependencies, which initializes
      # Kivy's Window and crashes hard ("Minimum required OpenGL version
      # (2.0) NOT found!"), leaving the process stuck rather than exiting
      # cleanly. KIVY_GL_BACKEND=angle_sdl2 tells Kivy to use its bundled
      # ANGLE backend (translates to DirectX) instead of raw OpenGL —
      # DirectX is available even without real GPU drivers, so this is
      # the standard fix for building/running Kivy apps in headless CI.
      - name: Build EXE with PyInstaller
        env:
          KIVY_GL_BACKEND: angle_sdl2
        run: |
          python -m PyInstaller --name PATSB_Traffic_Counter --onefile --windowed `
            --add-data "assets;assets" `
            --icon "assets/icon.png" `
            --log-level DEBUG `
            main.py 2>&1 | Tee-Object -FilePath pyinstaller_build.log

      - name: Upload PyInstaller log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-build-log
          path: pyinstaller_build.log
          retention-days: 7

      - name: Rename EXE with commit info
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s | tr -c '[:alnum:]-_' '_' | cut -c1-40)
          cd dist
          for f in *.exe; do
            [ -e "$f" ] || continue
            base="${f%.exe}"
            mv "$f" "${COMMIT_MSG}_${SHORT_SHA}_${base}.exe"
          done
          ls -la

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PATSB-Traffic-Counter-Windows
          path: dist/*.exe
          retention-days: 30
          if-no-files-found: warn
